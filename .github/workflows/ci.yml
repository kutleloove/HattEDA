name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "work/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.11.2"
  # aqtinstall 3.3.0 (latest PyPI release) cannot resolve Qt 6.11+ repository metadata; Qt 6.11
  # support was merged in miurahr/aqtinstall#1000 but is unreleased, so install a pinned commit.
  AQT_SOURCE: "git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7"

jobs:
  windows-mingw:
    name: Windows MinGW (Qt 6.11.2)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # CI-only toolchain: Qt MinGW kit plus the MinGW 13.1 and Ninja tools that match the local
      # C:\Qt setup. This is not an application dependency.
      - name: Install Qt, MinGW 13.1 and Ninja
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_mingw
          dir: ${{ runner.temp }}
          tools: tools_mingw1310,qt.tools.win64_mingw1310 tools_ninja,qt.tools.ninja
          cache: true
          cache-key-prefix: qt-mingw
          aqtsource: ${{ env.AQT_SOURCE }}
          py7zrversion: ">=1.1.3"

      - name: Export toolchain locations
        run: |
          $mingw = Join-Path $env:IQTA_TOOLS 'mingw1310_64'
          if (-not (Test-Path (Join-Path $mingw 'bin/g++.exe'))) {
            Get-ChildItem $env:IQTA_TOOLS | Format-Table Name
            throw "MinGW 13.1 not found under $mingw"
          }
          "HATTEDA_MINGW_DIR=$mingw" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$env:IQTA_TOOLS/Ninja" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Host "QT_ROOT_DIR=$env:QT_ROOT_DIR"
          Write-Host "HATTEDA_MINGW_DIR=$mingw"
          & (Join-Path $mingw 'bin/g++.exe') --version
          cmake --version

      - name: Configure (Debug)
        run: cmake --preset ci-mingw-debug -DHATTEDA_WERROR=ON

      - name: Build (Debug)
        run: cmake --build --preset ci-debug

      - name: Test (Debug)
        run: ctest --preset ci-debug

      # QtTest writes its results to build/<preset>/test-logs (CTest cannot capture its stdout).
      - name: Print test logs
        if: failure()
        run: |
          Get-ChildItem build/ci-mingw-debug/test-logs -File -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "::group::$($_.Name)"
            Get-Content $_.FullName
            Write-Host "::endgroup::"
          }

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-logs-windows-mingw-debug
          path: |
            build/ci-mingw-debug/test-logs/
            build/ci-mingw-debug/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 14

      - name: Configure (Release)
        run: cmake --preset ci-mingw-release -DHATTEDA_WERROR=ON

      - name: Build (Release)
        run: cmake --build --preset ci-release
